<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="../assests/img/spelogo.png" />
    <title>Organizing Committee - SPE YP Symposium 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#667eea",
                        "primary-dark": "#764ba2",
                        accent: "#f5576c",
                        "dark-bg": "#0f172a",
                        "light-bg": "#1e293b",
                        "text-light": "#e2e8f0",
                        "text-muted": "#a0aec0",
                    },
                    fontFamily: {
                        inter: ["Inter", "sans-serif"],
                        poppins: ["Poppins", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <style>
        body {
            font-family: "Inter", sans-serif;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-dark-bg via-slate-900 to-slate-800 text-text-light overflow-x-hidden">
    <div id="shared-header"></div>

    <section class="relative py-24 px-4 sm:px-6 lg:px-8 overflow-hidden">
        <div class="absolute inset-0 pointer-events-none">
            <div class="absolute -top-20 -left-20 w-80 h-80 rounded-full bg-primary/10 blur-3xl"></div>
            <div class="absolute -bottom-20 -right-20 w-80 h-80 rounded-full bg-accent/10 blur-3xl"></div>
        </div>

        <div class="relative max-w-6xl mx-auto">
            <div class="text-center mb-14" data-aos="fade-up">
                <span class="text-primary font-bold text-sm tracking-widest uppercase">Organizing Team</span>
                <h1 class="font-poppins text-4xl sm:text-5xl font-bold mt-3 mb-4 gradient-text">Meet Our Committee</h1>
                <p class="text-text-muted text-lg max-w-2xl mx-auto">
                    Dedicated professionals delivering the 2026 SPE Young Professional Symposium.
                </p>
            </div>

            <div id="organizing-committee-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <section class="py-20 px-4 sm:px-6 lg:px-8 bg-white border-t border-b border-slate-200">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-14" data-aos="fade-up">
                <span class="text-primary font-bold text-sm tracking-widest uppercase">Partnerships</span>
                <h2 class="font-poppins text-4xl font-bold mt-3 mb-4 text-slate-900">Our Sponsors</h2>
            </div>

            <div class="space-y-10">
                <div>
                    <div class="text-center mb-5">
                        <span class="inline-flex items-center rounded-full border border-amber-300 bg-amber-50 px-4 py-1.5 text-xs font-bold tracking-[0.22em] text-amber-700 uppercase">Platinum Sponsor</span>
                    </div>
                    <div class="grid grid-cols-1 max-w-md mx-auto gap-6">
                        <div class="bg-white border border-amber-200 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/sp3.png" alt="Ikosh Nigeria Limited" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                    </div>
                </div>

                <div>
                    <div class="text-center mb-5">
                        <span class="inline-flex items-center rounded-full border border-yellow-300 bg-yellow-50 px-4 py-1.5 text-xs font-bold tracking-[0.22em] text-yellow-700 uppercase">Gold Sponsors</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="bg-white border border-yellow-200 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/sp2.jpeg" alt="Heirs Energies" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                        <div class="bg-white border border-yellow-200 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/Oida Energy Group.png" alt="Oida Energy Group" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                    </div>
                </div>

                <div>
                    <div class="text-center mb-5">
                        <span class="inline-flex items-center rounded-full border border-slate-300 bg-slate-100 px-4 py-1.5 text-xs font-bold tracking-[0.22em] text-slate-700 uppercase">Silver Sponsors</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="bg-white border border-slate-300 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/bismuth.jfif" alt="Bismuth Engineering" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                        <div class="bg-white border border-slate-300 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/bonitas.jpeg" alt="Bonitas Group" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                        <div class="bg-white border border-slate-300 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/sp10.jpeg" alt="PES" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                    </div>
                </div>

                <div>
                    <div class="text-center mb-5">
                        <span class="inline-flex items-center rounded-full border border-orange-300 bg-orange-50 px-4 py-1.5 text-xs font-bold tracking-[0.22em] text-orange-700 uppercase">Bronze Sponsors</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white border border-orange-200 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/sp5.png" alt="Western Point Global Solutions Ltd" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                        <div class="bg-white border border-orange-200 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/sp4.png" alt="Greenbelt Tropical Environs Limited" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                        <div class="bg-white border border-orange-200 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/Workforce Energy Services 2.png" alt="Workforce Energy Services" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                        <div class="bg-white border border-orange-200 rounded-lg p-6 min-h-36 flex items-center justify-center">
                            <img src="../assests/img/sp8.png" alt="VAST Integrated Solutions Ltd" class="max-w-full max-h-28 h-auto object-contain" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="shared-footer"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assests/js/shared.js"></script>
    <script>
        const committeeMembers = [{
            image: "../assests/img/paulin.jpeg",
            name: "Pauline Nwamaka",
            role: "Young Professional Chair"
        }, {
            image: "../assests/img/2.jpg",
            name: "Iwowari Onyia",
            role: "YP Co-chair/Committee Chair"
        }, {
            image: "../assests/img/3.jpg",
            name: "Collins Okoh",
            role: "Deputy Committee Chair"
        }, {
            image: "../assests/img/4.jpg",
            name: "Queen Omoghene Moses",
            role: "Programs Chair"
        }, {
            image: "../assests/img/5.jpg",
            name: "Justus Igwe",
            role: "CV Review/Website Lead"
        }, {
            image: "../assests/img/6.jpg",
            name: "Patience Ogoh",
            role: "..."
        }, {
            image: "../assests/img/7.jpg",
            name: "Iheanyichukwu Orji",
            role: "Short Courses Team Lead"
        }, {
            image: "../assests/img/8.jpg",
            name: "Eunice Edeoghon",
            role: "..."
        }, {
            image: "../assests/img/9.jpg",
            name: "Nicholas Asimiea",
            role: "..."
        }, {
            image: "../assests/img/emmanuella.jpeg",
            name: "Emmanuella Ebere",
            role: "Protocol Lead"
        }, {
            image: "../assests/img/11.jpg",
            name: "Evangeline Ugochukwu",
            role: "..."
        }, {
            image: "../assests/img/12.jpg",
            name: "Patience Ogoh",
            role: "Branding and Souvenirs"
        }, {
            image: "../assests/img/13.jpg",
            name: "Daniella Obaze",
            role: "Media & Publicity"
        }, ];

        const committeeList = document.getElementById("organizing-committee-list");
        committeeList.innerHTML = committeeMembers
            .map(
                (member, index) => `
          <div
            class="group rounded-2xl overflow-hidden border border-primary/20 bg-white/5 hover:bg-white/10 transition duration-300 transform hover:-translate-y-2"
            data-aos="fade-up"
            data-aos-delay="${Math.min(index * 50, 350)}"
          >
            <img src="${member.image}" alt="${member.name}" class="w-full h-64 object-cover" />
            <div class="p-4">
              <h3 class="font-poppins text-lg font-bold text-text-light mb-1">${member.name}</h3>
              <p class="text-primary font-semibold text-xs">${member.role}</p>
            </div>
          </div>
        `
            )
            .join("");

        AOS.init({
            duration: 800,
            easing: "ease-in-out",
            once: true,
        });
    </script>
</body>

</html>
